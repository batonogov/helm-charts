target-branch: main
chart-dirs:
  - charts
chart-repos: []
helm-extra-args: --timeout 600s
validate-maintainers: false
# Version bumps are enforced by scripts/check-chart-version-bumps.sh so ci-only
# chart changes can stay version-neutral. Native ct version checks are too broad
# for this repository because they trigger on any file under charts/<name>/.
check-version-increment: false
