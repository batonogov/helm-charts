name: lint-test

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.16.4

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Fetch target branch
        env:
          BASE_BRANCH: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"

      - name: ct list-changed
        id: list-changed
        run: |
          set -euo pipefail
          changed=$(ct list-changed --config .github/ct.yaml)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "charts<<EOF"
              echo "$changed"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: ct lint
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --config .github/ct.yaml

      - name: helm smoke tests
        if: steps.list-changed.outputs.changed == 'true'
        env:
          CHANGED_CHARTS: ${{ steps.list-changed.outputs.charts }}
        run: |
          set -euo pipefail
          charts=()
          while IFS= read -r chart; do
            [[ -n "$chart" ]] && charts+=("$chart")
          done <<< "$CHANGED_CHARTS"
          bash scripts/helm-smoke-test.sh "${charts[@]}"

      - name: helm-docs check
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          set -euo pipefail
          go install github.com/norwoodj/helm-docs/cmd/helm-docs@v1.14.2
          $HOME/go/bin/helm-docs --chart-search-root charts
          if ! git diff --quiet -- 'charts/**/README.md'; then
            echo "::error::helm-docs is out of sync with values.yaml. Run helm-docs locally and commit the regenerated README.md."
            git diff -- 'charts/**/README.md'
            exit 1
          fi
