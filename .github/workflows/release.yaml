name: release

on:
  push:
    branches:
      - main

concurrency:
  group: chart-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: losisin/helm-docs-github-action@9e0787c426fdec38be6288bb5c0559dcb388412c # v2.0.1
        with:
          chart-search-root: charts
          fail-on-diff: 'false'
          version: v1.14.2

      - name: helm-docs check
        run: scripts/check-helm-docs.sh

      - name: Helm lint
        run: scripts/helm-lint-all.sh

      - name: Helm template
        run: scripts/helm-template-all.sh

      - name: DoQA portability checks
        run: scripts/check-doqa-portability.sh

      - name: Install Python test dependencies
        run: python3 -m pip install PyYAML==6.0.3

      - name: DoQA reliability checks
        run: python3 scripts/check-doqa-reliability.py

      - name: xray reliability checks
        run: |
          if [ -f scripts/check-xray-reliability.py ]; then
            python3 scripts/check-xray-reliability.py
          else
            echo "Skipping xray reliability checks: scripts/check-xray-reliability.py is unavailable until PR #121 is integrated."
          fi

      - name: DoQA integration unit tests
        run: python3 -m unittest discover -s scripts/doqa-kind -p 'test_*.py'

      - name: Release preflight unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  release:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install release preflight dependencies
        run: python3 -m pip install PyYAML==6.0.3

      - name: Reject already-released versions of changed charts
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: python3 scripts/check-release-versions.py

      - name: Configure git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1

      - uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          charts_dir: charts
          mark_as_latest: true
          # Repository-only pushes still contain unchanged, already-released charts.
          # The preflight above rejects this state only when such a chart changed.
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
