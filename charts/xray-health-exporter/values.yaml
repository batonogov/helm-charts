# -- Override the chart name (used in resource naming).
nameOverride: ""
# -- Fully override the generated release name.
fullnameOverride: ""

# -- Number of replicas. Values >1 force-enable `leaderElection.enabled` so only one pod publishes tunnel metrics.
replicaCount: 2

image:
  # -- Image repository.
  repository: ghcr.io/batonogov/xray-health-exporter
  # -- Image tag. Defaults to `v<chart appVersion>` when empty (upstream publishes v-prefixed tags to ghcr.io).
  tag: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent
  # -- Image pull secrets (list of `{name: <secret>}`).
  pullSecrets: []

# -- Annotations applied to every Deployment pod.
podAnnotations: {}
# -- Extra labels applied to every Deployment pod.
podLabels: {}

# -- Pod-level security context (non-root, matches upstream UID 10001).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

# -- Container-level security context (read-only rootfs, no privilege escalation).
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- Resource requests and limits for the exporter container
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi
# -- nodeSelector for the pod.
nodeSelector: {}
# -- Tolerations for the pod.
tolerations: []
# -- Affinity rules for the pod.
affinity: {}
# -- topologySpreadConstraints for the pod.
topologySpreadConstraints: []

# -- Extra environment variables (list of `{name, value}` or `{name, valueFrom}`).
extraEnv: []

# Built-in environment variables consumed by the exporter binary.
env:
  # -- Xray-core log level (`debug`/`info`/`warning`/`error`).
  XRAY_LOG_LEVEL: warning
  # -- Exporter log level (`debug`/`info`/`warning`/`error`). Replaces the deprecated `DEBUG=true` flag.
  LOG_LEVEL: info
  # -- Exporter log format (`text` or `json`).
  LOG_FORMAT: text
  # -- Default health-check method used when a tunnel omits `check_method`. `http` (HTTP GET), `ip` (IP echo via `IP_CHECK_URL`), or `download` (file download via `DOWNLOAD_URL`).
  CHECK_METHOD: http
  # -- IP-echo URL for the `ip` check method.
  IP_CHECK_URL: https://api.ipify.org?format=text
  # -- File URL for the `download` check method.
  DOWNLOAD_URL: https://proof.ovh.net/files/1Mb.dat
  # -- Timeout for the `download` check method (Go duration, e.g. `60s`, `2m`).
  DOWNLOAD_TIMEOUT: 60s
  # -- Minimum downloaded bytes for the `download` method to be considered successful.
  DOWNLOAD_MIN_SIZE: "51200"
  # -- One-shot mode. If `true`, run a single check cycle, print metrics to stdout, and exit. Disable for long-running Deployments (useful only for CronJob-style usage).
  RUN_ONCE: "false"

leaderElection:
  # -- Enable Kubernetes leader election so only one replica publishes `xray_tunnel_*`. Forced on whenever `replicaCount > 1`, regardless of this flag.
  enabled: true
  # -- Lease object name. Defaults to the release fullname.
  leaseName: ""
  rbac:
    # -- Create the Role + RoleBinding granting access to `coordination.k8s.io/leases`.
    create: true

serviceAccount:
  # -- Create a dedicated ServiceAccount for the Deployment.
  create: true
  # -- ServiceAccount name. Defaults to release fullname when empty.
  name: ""
  # -- Annotations applied to the ServiceAccount.
  annotations: {}

# Optional HTTP Basic Auth on the /metrics endpoint (upstream v1.6.0+).
metricsBasicAuth:
  # -- Protect /metrics with HTTP Basic Auth. When `true`, all three `METRICS_*` envs are rendered and Prometheus must scrape with matching credentials.
  enabled: false
  # -- Username. Defaults to upstream's `metricsUser` when empty.
  username: ""
  # -- Use an existing Secret (key `password`) instead of a chart-generated one. Takes precedence over the generated Secret.
  existingSecret: ""
  # -- Name override for the chart-generated Secret holding the Basic Auth password. Defaults to `<release>-basicauth`.
  secretName: ""

# Optional Pushgateway push (upstream v1.6.0+). Complementary to the /metrics pull endpoint; only the leader pushes.
metricsPush:
  # -- Full Pushgateway URL, e.g. `https://user:pass@pushgateway:9091`. Credentials embedded in the URL are used for HTTP Basic Auth. Empty disables push (default).
  url: ""
  # -- Interval between pushes (Go duration). Defaults to the smallest tunnel `check_interval`, or `30s` upstream.
  interval: ""
  # -- Value of the `instance` grouping label for pushed metrics. Defaults to the pod hostname upstream.
  instance: ""

service:
  # -- Service type.
  type: ClusterIP
  # -- Service port.
  port: 9273
  # -- Annotations applied to the Service.
  annotations: {}

# Exporter YAML config (rendered into a ConfigMap and mounted at /app/config.yaml).
config:
  # -- Global tunnel-check defaults applied when an entry omits the field.
  defaults:
    check_url: https://www.google.com
    check_interval: 30s
    check_timeout: 30s
  # -- Subscription URLs that auto-discover tunnels. See upstream README for schema. WARNING: subscription URLs typically embed access tokens — they are rendered into a plain ConfigMap. Use `existingConfigSecret` to source `config.yaml` from a Secret instead.
  subscriptions: []
  # -- Static tunnels. Each entry needs either `url` (VLESS) or `xray_config_file`. At least one tunnel or one subscription is required (or set `existingConfigSecret`); otherwise the exporter refuses to start.
  tunnels: []

# -- Mount an existing Secret containing `config.yaml` instead of rendering one from `.Values.config`.
existingConfigSecret: ""

metrics:
  serviceMonitor:
    # -- Create a Prometheus Operator `ServiceMonitor` for the exporter.
    enabled: false
    # -- Namespace for the ServiceMonitor. Defaults to the release namespace.
    namespace: ""
    # -- Scrape interval.
    interval: 30s
    # -- Scrape timeout.
    scrapeTimeout: 10s
    # -- Extra labels (e.g. `release: kube-prometheus-stack`).
    labels: {}
    # -- Extra annotations on the ServiceMonitor.
    annotations: {}
    # -- Optional metric relabelings.
    metricRelabelings: []
    # -- Optional relabelings.
    relabelings: []
  prometheusRule:
    # -- Create a Prometheus Operator `PrometheusRule` with default tunnel alerts.
    enabled: false
    # -- Extra labels on the PrometheusRule (e.g. `release: kube-prometheus-stack`).
    labels: {}
    # -- Extra annotations.
    annotations: {}
    # -- Override the default rule list. When empty the chart ships sensible defaults (`XrayTunnelDown`, `XrayHighLatency`, `XrayNoRecentCheck`).
    rules: []

networkPolicy:
  # -- Create a NetworkPolicy. By default allows all egress and Prometheus-style ingress to the metrics port.
  enabled: false
  # -- Extra ingress rules. When unset, the chart allows ingress from any pod with label `app.kubernetes.io/name: prometheus`.
  ingress: []
  # -- Extra egress rules. When unset, allows all egress.
  egress: []

podDisruptionBudget:
  # -- Create a PodDisruptionBudget.
  enabled: false
  # -- Minimum number of pods that must be available during disruptions.
  minAvailable: 1
  # -- Maximum number of pods that can be unavailable during disruptions. Takes precedence over `minAvailable` when set.
  maxUnavailable:
