{{- if eq (include "xray-health-exporter.basicAuthSecretCreate" .) "true" -}}
{{- $name := include "xray-health-exporter.basicAuthSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $passwordKey := include "xray-health-exporter.basicAuthPasswordKey" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "xray-health-exporter.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ include "xray-health-exporter.basicAuthUsernameKey" . }}: {{ include "xray-health-exporter.basicAuthUsername" . | quote }}
  # The password is reused from the live Secret on upgrade (lookup) so it does
  # not rotate between releases. A fresh value is generated only on first install.
  {{ $passwordKey }}: {{ coalesce
    (default "" (get (default (dict) $existing.data) $passwordKey) | b64dec)
    (randAlphaNum 32) | quote }}
{{- end }}
