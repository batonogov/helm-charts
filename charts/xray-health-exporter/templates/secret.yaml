{{- if eq (include "xray-health-exporter.basicAuthSecretCreate" .) "true" -}}
{{- $name := include "xray-health-exporter.basicAuthSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "xray-health-exporter.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Reused from the live Secret on upgrade (lookup) so the password does not
  # rotate between releases. A fresh value is generated only on first install.
  password: {{ coalesce
    (default "" (get (default (dict) $existing.data) "password") | b64dec)
    (randAlphaNum 32) | quote }}
{{- end }}
