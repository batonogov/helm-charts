{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "xray-health-exporter.fullname" . }}
  labels:
    {{- include "xray-health-exporter.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "xray-health-exporter.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if .Values.networkPolicy.ingress }}
    {{- toYaml .Values.networkPolicy.ingress | nindent 4 }}
    {{- else }}
    - from:
        - {{- if .Values.metrics.serviceMonitor.enabled }}
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.metrics.serviceMonitor.namespace | default .Release.Namespace }}
          {{- end }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9273
    {{- end }}
  egress:
    {{- if .Values.networkPolicy.egress }}
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
    {{- else }}
    - {}
    {{- end }}
{{- end }}
