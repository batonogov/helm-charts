{{- include "xray-health-exporter.validateConfig" . -}}
{{- include "xray-health-exporter.validateExtraVolumes" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "xray-health-exporter.fullname" . }}
  labels:
    {{- include "xray-health-exporter.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "xray-health-exporter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "xray-health-exporter.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if not .Values.existingConfigSecret }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "xray-health-exporter.serviceAccountName" . }}
      automountServiceAccountToken: {{ eq (include "xray-health-exporter.leaderElectionEnabled" .) "true" }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: exporter
          image: "{{ .Values.image.repository }}:{{ include "xray-health-exporter.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: metrics
              containerPort: 9273
              protocol: TCP
          env:
            - name: CONFIG_FILE
              value: /app/config.yaml
            - name: LISTEN_ADDR
              value: ":9273"
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- if eq (include "xray-health-exporter.leaderElectionEnabled" .) "true" }}
            - name: LEADER_ELECTION
              value: "true"
            - name: LEADER_ELECTION_NAME
              value: {{ include "xray-health-exporter.leaseName" . | quote }}
            - name: LEADER_ELECTION_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LEADER_ELECTION_IDENTITY
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- end }}
            {{- if .Values.metricsBasicAuth.enabled }}
            - name: METRICS_PROTECTED
              value: "true"
            - name: METRICS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "xray-health-exporter.basicAuthSecretName" . }}
                  key: {{ include "xray-health-exporter.basicAuthUsernameKey" . }}
            - name: METRICS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "xray-health-exporter.basicAuthSecretName" . }}
                  key: {{ include "xray-health-exporter.basicAuthPasswordKey" . }}
            {{- end }}
            {{- if or .Values.metricsPush.url .Values.metricsPush.urlSecret.name }}
            - name: METRICS_PUSH_URL
              {{- if .Values.metricsPush.urlSecret.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.metricsPush.urlSecret.name }}
                  key: {{ .Values.metricsPush.urlSecret.key | default "url" }}
              {{- else }}
              value: {{ .Values.metricsPush.url | quote }}
              {{- end }}
            {{- with .Values.metricsPush.interval }}
            - name: METRICS_PUSH_INTERVAL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.metricsPush.instance }}
            - name: METRICS_INSTANCE
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          {{- if .Values.existingConfigSecret }}
          secret:
            secretName: {{ .Values.existingConfigSecret }}
          {{- else }}
          configMap:
            name: {{ include "xray-health-exporter.fullname" . }}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
