# Reference values used to verify the chart in a kubeadm cluster with traefik
# ingress, longhorn storage and cert-manager (letsencrypt HTTP-01). Adjust
# `appUrl`, `ingress.className`, `cert-manager.io/cluster-issuer`, and storage
# classes for your environment before running `helm install`.

appUrl: "doqa.example.com"
useSsl: true

nodeSelector:
  kubernetes.io/os: linux

podLabels:
  deployment-profile: in-tree

defaultSecurityContext:
  pod:
    seccompProfile:
      type: RuntimeDefault

serviceAccount:
  create: true
  annotations:
    example.com/owner: platform

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: "traefik-redirect-https@kubernetescrd"
  tls:
    enabled: true

postgresql:
  cnpg:
    create: true
    instances: 1
    storage:
      size: 4Gi
      storageClass: longhorn

redis:
  create: true
  storage:
    size: 1Gi
    storageClass: longhorn

rabbitmq:
  create: true
  storage:
    size: 1Gi
    storageClass: longhorn

minio:
  create: true
  client:
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
  storage:
    size: 4Gi
    storageClass: longhorn

secrets:
  create: true
