# -- Override the chart name part of resource names. SET-ONCE-AT-INSTALL:
# `app.kubernetes.io/name` (derived from this) lands in every Deployment's
# `.spec.selector`, which Kubernetes treats as immutable. Changing
# nameOverride on an existing release makes the upgrade fail with
# `field is immutable` on all Deployments until the value is reverted or the
# release is reinstalled. nameOverride also feeds doqa.fullname (when
# fullnameOverride is unset), so it additionally renames every chart-managed
# resource and orphans the redis/rabbitmq/minio PVCs.
nameOverride: ""
# -- Override the full name of resources. SET-ONCE-AT-INSTALL: changing this
# on an existing release renames every chart-managed resource (Helm drops the
# old-named objects and creates new ones), orphaning the CNPG Cluster and the
# redis/rabbitmq/minio PVCs (data loss). Do not change after first install.
fullnameOverride: ""

# -- Default node selector applied to all components. Per-component values override this.
nodeSelector: {}
# -- Default affinity applied to all components. Per-component values override this.
affinity: {}
# -- Default tolerations applied to all components. Per-component values override this.
tolerations: []

# -- DoQA application URL (host without protocol, e.g. "doqa.example.com")
appUrl: "doqa.example.com"
# -- Frontend URL (defaults to appUrl when empty)
appFrontendUrl: ""
# -- Whether the public URL is HTTPS. Affects USE_SSL env and bucket URL protocol
useSsl: true
# -- Enable verbose debug logging
debug: false
# -- Issue/support email exposed to backend (`ISSUE_MAIL`)
mailIssue: "support@doqa.app"
# -- Optional explicit API base URL (`API_BASE_URL`). Leave empty to use internal backend service.
apiBaseUrl: ""
# -- Optional backend URL (`DOQA_BACKEND_URL`) passed to backend workloads and the autotest-parser. Empty matches the vendor default.
doqaBackendUrl: ""

product:
  # -- Product slug. Custom products also require a matching frontend image. (`PRODUCT`)
  id: "doqa"
  # -- Backend application name. (`APP_NAME`)
  appName: "DoQA"
  # -- Backend application brand. (`APP_BRAND`)
  appBrand: "DoQA"
  # -- Product display name, also used in Python service titles. (`PRODUCT_NAME`)
  name: "DoQA"
  # -- Notification email sender display name. (`PRODUCT_FROM_DISPLAY`)
  fromDisplay: "DoQA"
  # -- Product support email used by notifications. (`PRODUCT_SUPPORT_EMAIL`)
  supportEmail: "support@doqa.app"
  # -- Product documentation URL. (`PRODUCT_DOCS_URL`)
  docsUrl: "https://docs.doqa.app"
  # -- Product website URL. (`PRODUCT_SITE_URL`)
  siteUrl: "https://doqa.app"
  # -- Product Telegram URL; empty hides the link. (`PRODUCT_TELEGRAM_URL`)
  telegramUrl: "https://t.me/DoQATMS"
  # -- Product support Telegram URL; empty hides the link. (`PRODUCT_SUPPORT_TELEGRAM_URL`)
  supportTelegramUrl: "https://t.me/doqa_team"
  # -- Product VK URL; empty hides the link. (`PRODUCT_VK_URL`)
  vkUrl: "https://vk.com/doqa_tms"
  # -- Product YouTube URL; empty hides the link. (`PRODUCT_YOUTUBE_URL`)
  youtubeUrl: "https://www.youtube.com/channel/UCTzbumj-8d9ijeU3gEWWTPQ"
  # -- Product Telegram news URL exposed to backend workloads; empty hides the link. (`PRODUCT_TELEGRAM_NEWS_URL`)
  telegramNewsUrl: "https://t.me/DoQA_news_bot"

image:
  # -- Container registry hosting DoQA images
  registry: registry.control.doqa.app
  # -- Default imagePullPolicy
  pullPolicy: IfNotPresent
  # -- imagePullSecrets applied to all chart-managed workload pods
  pullSecrets: []

# Chart-managed secrets. When create=true the chart auto-generates secret values
# (stable across upgrades via `lookup`), except for entries explicitly set below.
# Explicit app/apiKeys/pusher/rabbitmq/minio names always reference pre-existing
# Secrets and can be mixed with generated ones. When create=false, all applicable
# names must reference pre-existing Secrets in the namespace.
secrets:
  # -- Generate chart-managed secrets with random values
  create: true
  # -- Existing secret with keys `app-key`, `jwt-secret`, `internal-system-key`. Default <release>-app-secrets
  app: ""
  # -- Existing secret with keys `statistic-api-key`, `notification-api-key`, `llm-api-key`. Default <release>-api-keys
  apiKeys: ""
  # -- Existing secret with key `app-secret`. Default <release>-pusher-secret
  pusher: ""
  # -- Existing secret with keys `password`, `erlang-cookie`. Default <release>-rabbitmq-secret
  rabbitmq: ""
  # -- Existing secret with keys `access-key`, `secret-key`. Default <release>-minio-secrets
  minio: ""
  # -- Existing secret with key `password`. Required only when mail.host is set and SMTP needs auth
  mail: ""
  # -- Existing secret with key `password`. Required only when ldap.enabled=true
  ldap: ""

postgresql:
  cnpg:
    # -- Provision a new CNPG `Cluster` resource. Requires CNPG operator in cluster
    create: true
    # -- Number of CNPG instances
    instances: 1
    # -- CNPG postgres image
    imageName: "ghcr.io/cloudnative-pg/postgresql:17"
    storage:
      # -- PVC size for each CNPG instance
      size: 4Gi
      # -- StorageClass for CNPG PVCs (empty = cluster default)
      storageClass: ""
  # -- External PostgreSQL host (used only when cnpg.create=false)
  host: ""
  # -- PostgreSQL port
  port: 5432
  # -- Database name
  database: doqa
  # -- Database user
  username: doqa
  passwordSecret:
    # -- External secret name with the password (used when cnpg.create=false)
    name: ""
    # -- Key inside the password secret
    key: password

redis:
  # -- Provision an in-tree Redis Deployment+PVC. Single replica, no HA
  create: true
  image:
    # -- Redis image
    repository: docker.io/redis
    # -- Redis tag
    tag: "8-alpine"
  storage:
    # -- PVC size for Redis
    size: 1Gi
    # -- StorageClass for Redis PVC
    storageClass: ""
  # -- Resource requests and limits
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  # -- Node selector for Redis pods. Overrides global nodeSelector
  nodeSelector: {}
  # -- Affinity for Redis pods. Overrides global affinity
  affinity: {}
  # -- Tolerations for Redis pods. Overrides global tolerations
  tolerations: []
  # -- External Redis host (used only when create=false)
  host: ""
  # -- Redis port
  port: 6379
  # -- Logical Redis DB for backend cache/queues
  db: 0
  passwordSecret:
    # -- External Redis password secret (leave empty for no auth)
    name: ""
    # -- Key inside the password secret
    key: password
  # Notification/celery uses its own Redis logical DB (vendor uses key prefix "doqa")
  notification:
    # -- Notification Redis host (defaults to redis host when empty)
    host: ""
    # -- Notification Redis port
    port: 6379
    # -- Notification logical DB (vendor uses string "doqa")
    db: "doqa"
    passwordSecret:
      # -- Notification Redis password secret. When empty and notification.host is also empty, inherits redis.passwordSecret; a separate host does not inherit it
      name: ""
      # -- Key inside the password secret
      key: password

rabbitmq:
  # -- Entrypoint capabilities for setting PVC ownership and switching to the rabbitmq user
  containerSecurityContext:
    capabilities:
      add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
  # -- Provision an in-tree RabbitMQ Deployment+PVC
  create: true
  image:
    # -- RabbitMQ image
    repository: docker.io/rabbitmq
    # -- RabbitMQ tag (management variant for built-in UI)
    tag: "4-management-alpine"
  storage:
    # -- PVC size for RabbitMQ
    size: 1Gi
    # -- StorageClass for RabbitMQ PVC
    storageClass: ""
  # -- Resource requests and limits
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  # -- Node selector for RabbitMQ pods. Overrides global nodeSelector
  nodeSelector: {}
  # -- Affinity for RabbitMQ pods. Overrides global affinity
  affinity: {}
  # -- Tolerations for RabbitMQ pods. Overrides global tolerations
  tolerations: []
  # -- External RabbitMQ host (used only when create=false)
  host: ""
  # -- AMQP port
  port: 5672
  # -- RabbitMQ user
  username: admin
  # -- RabbitMQ virtual host
  virtualHost: "/"

minio:
  # -- Provision an in-tree MinIO Deployment+PVC + bucket-init Job
  create: true
  image:
    # -- MinIO image
    repository: quay.io/minio/minio
    # -- MinIO tag
    tag: "RELEASE.2025-10-15T17-29-55Z"
  client:
    image:
      # -- mc client image (used by bucket-init Job)
      repository: quay.io/minio/mc
      # -- mc tag
      tag: "RELEASE.2025-08-13T08-35-41Z"
    # -- Resource requests and limits for the bucket-init Job
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
    # -- Node selector for the bucket-init Job. Overrides global nodeSelector
    nodeSelector: {}
    # -- Affinity for the bucket-init Job. Overrides global affinity
    affinity: {}
    # -- Tolerations for the bucket-init Job. Overrides global tolerations
    tolerations: []
    # -- Pod security context for the bucket-init Job
    podSecurityContext: {}
    # -- Container security context for the bucket-init Job. Kept separate from defaultSecurityContext because the current mc image runs as root
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
  storage:
    # -- PVC size for MinIO
    size: 4Gi
    # -- StorageClass for MinIO PVC
    storageClass: ""
  # -- Resource requests and limits
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # -- Node selector for MinIO pods. Overrides global nodeSelector
  nodeSelector: {}
  # -- Affinity for MinIO pods. Overrides global affinity
  affinity: {}
  # -- Tolerations for MinIO pods. Overrides global tolerations
  tolerations: []
  # -- External MinIO/S3 endpoint (used only when create=false). For in-tree MinIO chart computes internal URL automatically
  endpoint: ""
  # -- Verify the upstream TLS certificate when nginx proxies to an HTTPS MinIO/S3 endpoint. Disable only for a self-signed endpoint that cannot use a trusted certificate
  tlsVerify: true
  # -- Bucket name
  bucket: doqa
  # -- Region
  region: ru-1
  # -- Public bucket URL (defaults to "<scheme>://<appUrl>/<bucket>" when empty, served via internal nginx)
  bucketUrl: ""

mail:
  # -- Mailer driver
  mailer: smtp
  # -- SMTP host (leave empty to disable mail)
  host: ""
  # -- SMTP port
  port: 587
  # -- SMTP user
  username: ""
  # -- Encryption (tls/ssl/null)
  encryption: tls
  # -- Sender address
  fromAddress: ""
  # -- Sender display name
  fromName: "DoQA"

ldap:
  # -- Enable LDAP login
  enabled: false
  # -- LDAP host
  host: ""
  # -- LDAP port
  port: 389
  # -- Bind DN of the technical account
  username: ""
  # -- Search base DN
  baseDn: ""
  # -- Encryption (ssl/tls/"")
  encryption: ""
  # -- Use SASL bind
  sasl: false

pusher:
  # -- Pusher protocol app id
  appId: web-socket
  # -- Pusher protocol app key
  appKey: web-socket
  # -- Pusher protocol scheme used for internal websocket calls
  scheme: http
  # -- Soketi exposed port
  port: 6001

# Backend (php-fpm) — Laravel API
backend:
  # -- Laravel cache prefix. Preserve across upgrades and brand changes to retain cache entries and JWT revocations. (`CACHE_PREFIX`)
  cachePrefix: "laravel_cache:"
  # -- Laravel Redis prefix. Preserve across upgrades and brand changes to retain sessions and other Redis state. (`REDIS_PREFIX`)
  redisPrefix: "laravel_database_"
  # -- Laravel session cookie name. Preserve across upgrades and brand changes to keep existing browser sessions. (`SESSION_COOKIE`)
  sessionCookie: "laravel_session"
  image:
    # -- Backend image repository (relative to image.registry)
    repository: doqa/doqa-backend
    # -- Backend image tag
    tag: 4.3.8-box
  # -- Backend replica count
  replicas: 2
  # -- Disable only the migration init container; the vendor image CMD may run migrations independently
  skipMigrate: false
  migrate:
    # -- Wait for RabbitMQ AMQP readiness before running migrations. Vendor
    # 4.2.0 added a compose dependency on rabbitmq because some migrations
    # dispatch jobs; the chart mirrors that by probing the broker first.
    waitForRabbitmq: true
  phpFpm:
    # -- Use the current image configuration with an overridden pool size. Size memory for your workload.
    enabled: false
    # -- Maximum worker count; other pool settings are inherited from the image and validated by the init container.
    maxChildren: 5
  # -- Capabilities required to start nginx/FPM in the vendor backend. Global chart restrictions remain in effect.
  containerSecurityContext:
    capabilities:
      add: ["CHOWN", "DAC_OVERRIDE", "SETUID", "SETGID"]
  # -- Application readiness check: HTTP 2xx–4xx succeed; 5xx and transport errors fail. null disables the probe.
  readinessProbe:
    exec:
      command:
        - sh
        - -ec
        - |-
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8080/)
          case "$code" in 2??|3??|4??) exit 0 ;; *) exit 1 ;; esac
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 8
  # -- TCP liveness avoids restarting the backend on FPM saturation or database unavailability. null disables the probe.
  livenessProbe:
    tcpSocket:
      port: http
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 10
  # -- Resource requests and limits
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Topology spread constraints for multi-replica Deployments
topologySpreadConstraints:
  backend: []
  # - maxSkew: 1
  #   topologyKey: kubernetes.io/hostname
  #   whenUnsatisfiable: DoNotSchedule
  #   labelSelector:
  #     matchLabels:
  #       app.kubernetes.io/component: backend
  frontend: []
  # - maxSkew: 1
  #   topologyKey: kubernetes.io/hostname
  #   whenUnsatisfiable: DoNotSchedule
  #   labelSelector:
  #     matchLabels:
  #       app.kubernetes.io/component: frontend
  queue: []
  # - maxSkew: 1
  #   topologyKey: kubernetes.io/hostname
  #   whenUnsatisfiable: DoNotSchedule
  #   labelSelector:
  #     matchLabels:
  #       app.kubernetes.io/component: queue

# Queue worker (`queue:work --queue=default,search,requirements,autotests-domain,outbound-webhooks,import`)
queue:
  # -- Queue worker replica count
  replicas: 3
  # -- Wait for RabbitMQ AMQP readiness before starting the worker. Vendor
  # 4.2.1 added a compose dependency on rabbitmq for the queue service; the
  # chart mirrors that by probing the broker first.
  waitForRabbitmq: true
  # -- Resource requests and limits
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Cron / scheduled jobs (`schedule:work`). Single replica is mandatory
cron:
  # -- Resource requests and limits
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Frontend (Nuxt SPA)
frontend:
  image:
    # -- Frontend image repository (relative to image.registry)
    repository: doqa/doqa-frontend
    # -- Frontend image tag
    tag: 4.3.3-box
  # -- Frontend replica count
  replicas: 2
  # -- Capabilities required to start nginx in the component image; privilege escalation remains disabled.
  containerSecurityContext:
    capabilities:
      add: ["CHOWN", "DAC_OVERRIDE", "SETUID", "SETGID"]
  # -- Resource requests and limits
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Autotest parser (FastAPI, RabbitMQ-driven in v4)
autotestParser:
  image:
    # -- Autotest parser image repository
    repository: doqa/doqa-parsing-autotests
    # -- Autotest parser image tag
    tag: 4.3.1-box
  # -- Autotest parser replica count
  replicas: 1
  # -- Resource requests and limits
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Autotests queue worker (backend image). Declares the RabbitMQ queues on
# start, then runs `workerProcesses` parallel `autotests:work` consumers per
# pod. Vendor 4.3.1 compose service `doqa_autotests`.
autotestsWorker:
  # -- Autotests worker replica count (vendor scales it with QUEUE_WORKERS)
  replicas: 3
  # -- Parallel `autotests:work` processes per pod (vendor AUTOTESTS_WORKER_PROCESSES)
  workerProcesses: 3
  # -- RabbitMQ prefetch per `autotests:work` process (vendor AUTOTESTS_PREFETCH)
  prefetch: 10
  # -- Wait for RabbitMQ AMQP readiness before starting the worker. Vendor
  # 4.3.1 gates the autotests service on a healthy broker; the chart mirrors
  # that by probing the broker first.
  waitForRabbitmq: true
  # -- Resource requests and limits
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# LLM bulk queue worker (backend image), long-timeout consumer of the
# `llm-bulk` queue. Vendor 4.3.1 compose service `doqa_llm_bulk_queue`.
llmBulkQueue:
  # -- LLM bulk queue worker replica count (vendor runs a single replica)
  replicas: 1
  # -- Wait for RabbitMQ AMQP readiness before starting the worker. Vendor
  # 4.3.1 gates the llm-bulk service on a healthy broker; the chart mirrors
  # that by probing the broker first.
  waitForRabbitmq: true
  # -- Resource requests and limits
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Statistic micro-service (Python ASGI)
statistic:
  image:
    # -- Statistic image repository
    repository: doqa/doqa-statistic
    # -- Statistic image tag
    tag: 4.3.0-box
  # -- Replica count
  replicas: 1
  # -- Resource requests and limits
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# LLM micro-service (Python ASGI)
llm:
  image:
    # -- LLM image repository
    repository: doqa/doqa-llm
    # -- LLM image tag
    tag: 4.3.0-box
  # -- Replica count
  replicas: 1
  # -- Resource requests and limits
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Notification micro-service (Python ASGI + Celery worker)
notification:
  image:
    # -- Notification image repository
    repository: doqa/doqa-notify
    # -- Notification image tag
    tag: 4.3.0-box
  # -- API replica count
  replicas: 1
  # -- Resource requests and limits
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  worker:
    # -- Celery worker replica count
    replicas: 1
    # -- Celery `--concurrency` value
    concurrency: 8
    # -- Worker resource requests and limits
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

# Telegram bot — optional companion service
telegramBot:
  # -- Enable telegram bot
  enabled: false
  image:
    # -- Telegram bot image repository
    repository: doqa/doqa-telegram-bot
    # -- Telegram bot image tag
    tag: 4.3.0-box
  # -- Bot username (BOT_NAME)
  botName: ""
  # -- Existing secret with key `token` for the Telegram bot token
  tokenSecret: ""
  # -- Replica count
  replicas: 1
  # -- Resource requests and limits
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Soketi WebSocket server
websocket:
  image:
    # -- Vendor Soketi image repository, relative to image.registry. A fully qualified repository may be used for an exact private mirror.
    repository: service/soketi
    # -- Soketi image tag
    tag: 16-alpine
  # -- Replica count
  replicas: 1
  # -- Resource requests and limits
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Internal nginx router
nginx:
  image:
    # -- Vendor nginx image repository, relative to image.registry. A fully qualified repository may be used for an exact private mirror.
    repository: service/nginx
    # -- Nginx image tag
    tag: 1.23.3-alpine
  # -- Replica count
  replicas: 2
  # -- Maximum upload size. `0` disables the limit (matches vendor 4.2.0 nginx).
  clientMaxBodySize: "0"
  # -- Capabilities required to start nginx in the component image; privilege escalation remains disabled.
  containerSecurityContext:
    capabilities:
      add: ["CHOWN", "DAC_OVERRIDE", "SETUID", "SETGID", "NET_BIND_SERVICE"]
  # -- Trust the original scheme only behind a trusted Ingress that overwrites X-Forwarded-Proto. Disable for direct router exposure.
  trustForwardedProto: false
  # -- Upstream read timeout; increase in deployment values if needed.
  proxyReadTimeout: 60s
  # -- Separate WebSocket read timeout; align with heartbeat and Ingress settings.
  websocketReadTimeout: 60s
  # -- Resource requests and limits
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

ingress:
  # -- Create the Ingress resource. Defaults to true. When enabled, `ingress.className` is REQUIRED and rendering fails with a clear error if it is empty (no Ingress controller claims an empty className).
  enabled: true
  # -- REQUIRED when `ingress.enabled=true`. IngressClassName the controller listens on (e.g. nginx, traefik). Empty value fails rendering with a clear error.
  className: ""
  # -- Extra annotations (e.g. cert-manager.io/cluster-issuer)
  annotations: {}
  tls:
    # -- Enable TLS in the Ingress
    enabled: true
    # -- Existing TLS secret name (empty = <release>-tls)
    secretName: ""

networkPolicy:
  # -- Enable NetworkPolicy resources. Creates a default-deny-ingress policy and explicit allow rules for all internal traffic paths
  enabled: false

autoscaling:
  # -- Enable HorizontalPodAutoscaler for backend, frontend, and queue Deployments. When enabled, the replicas field is removed from those Deployments (HPA manages replicas)
  enabled: false
  backend:
    # -- Minimum replicas for backend HPA
    minReplicas: 2
    # -- Maximum replicas for backend HPA
    maxReplicas: 5
    # -- Target CPU utilization percentage for backend HPA
    targetCPUUtilizationPercentage: 80
  frontend:
    # -- Minimum replicas for frontend HPA
    minReplicas: 2
    # -- Maximum replicas for frontend HPA
    maxReplicas: 5
    # -- Target CPU utilization percentage for frontend HPA
    targetCPUUtilizationPercentage: 80
  queue:
    # -- Minimum replicas for queue HPA
    minReplicas: 3
    # -- Maximum replicas for queue HPA
    maxReplicas: 5
    # -- Target CPU utilization percentage for queue HPA
    targetCPUUtilizationPercentage: 80

serviceAccount:
  # -- Create a dedicated ServiceAccount
  create: false
  # -- Existing ServiceAccount name when create=false
  name: ""
  # -- Annotations added to the chart-managed ServiceAccount
  annotations: {}

# Default security context applied to chart-managed Deployments. Each component
# can override via its own `podSecurityContext` / `containerSecurityContext`
# keys. The MinIO bucket-init Job uses `minio.client.*SecurityContext` instead.
# Example hardening:
#   defaultSecurityContext:
#     pod:
#       runAsNonRoot: true
#       fsGroup: 1000
#     container:
#       allowPrivilegeEscalation: false
#       readOnlyRootFilesystem: false
#       capabilities:
#         drop: ["ALL"]
defaultSecurityContext:
  pod: {}
  container:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

serviceMonitor:
  # -- Create a Prometheus Operator ServiceMonitor for the backend Service
  enabled: false
  # -- Scrape interval (Prometheus duration format, e.g. 30s, 1m)
  interval: ""
  # -- Scrape timeout (Prometheus duration format, e.g. 10s, 30s)
  scrapeTimeout: ""
  # -- Labels for Prometheus to select the ServiceMonitor
  labels: {}
  # -- Namespace to deploy the ServiceMonitor into (defaults to the release namespace when empty)
  namespace: ""

podDisruptionBudget:
  # -- Create PodDisruptionBudget resources for multi-replica components
  enabled: false
  backend:
    # -- Minimum number of backend pods that must remain available during disruptions
    minAvailable: 1
  frontend:
