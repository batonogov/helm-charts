{{- if .Values.telegramBot.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "doqa.fullname" . }}-telegram-bot
  labels:
    {{- include "doqa.labels" . | nindent 4 }}
    app.kubernetes.io/component: telegram-bot
spec:
  replicas: {{ .Values.telegramBot.replicas }}
  selector:
    matchLabels:
      {{- include "doqa.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: telegram-bot
  template:
    metadata:
      labels:
        {{- include "doqa.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: telegram-bot
      {{- with .Values.extraAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "doqa.serviceAccountName" . }}
      {{- include "doqa.imagePullSecrets" . | nindent 6 }}
      {{- include "doqa.podSecurityContext" . | nindent 6 }}
      containers:
      - name: telegram-bot
        image: {{ include "doqa.image" (dict "img" .Values.telegramBot.image "root" .) | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- include "doqa.containerSecurityContext" . | nindent 8 }}
        command:
        - python
        - app_run.py
        env:
          {{- include "doqa.notificationEnv" . | nindent 8 }}
        resources:
          {{- toYaml .Values.telegramBot.resources | nindent 10 }}
      {{- with .Values.telegramBot.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.telegramBot.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.telegramBot.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
