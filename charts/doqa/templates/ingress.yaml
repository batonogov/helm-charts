{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "doqa.fullname" . }}
  labels:
    {{- include "doqa.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ required "ingress.className is required when ingress.enabled=true" .Values.ingress.className | quote }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.appUrl | quote }}
      secretName: {{ default (include "doqa.resourceName" (dict "ctx" . "suffix" "tls")) .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.appUrl | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "doqa.resourceName" (dict "ctx" . "suffix" "nginx") }}
                port:
                  number: 80
{{- end }}
