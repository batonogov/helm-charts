apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "doqa.fullname" . }}-autotests-worker
  labels:
    {{- include "doqa.labels" . | nindent 4 }}
    app.kubernetes.io/component: autotests-worker
spec:
  replicas: {{ .Values.autotestsWorker.replicas }}
  selector:
    matchLabels:
      {{- include "doqa.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: autotests-worker
  template:
    metadata:
      annotations:
        checksum/env: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.extraAnnotations }}
        {{- include "doqa.extraAnnotations" . | nindent 8 }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "doqa.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: autotests-worker
        {{- with .Values.podLabels }}
        {{- include "doqa.podLabels" . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "doqa.serviceAccountName" . }}
      {{- include "doqa.imagePullSecrets" . | nindent 6 }}
      {{- include "doqa.podSecurityContext" (dict "component" .Values.autotestsWorker "root" .) | nindent 6 }}
      {{- if .Values.autotestsWorker.waitForRabbitmq }}
      initContainers:
      - name: wait-for-rabbitmq
        image: {{ include "doqa.image" (dict "img" .Values.backend.image "root" .) | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- include "doqa.containerSecurityContext" (dict "component" .Values.autotestsWorker "root" .) | nindent 8 }}
        env:
        - name: RABBITMQ_HOST
          value: {{ include "doqa.rabbitmq.host" . | quote }}
        - name: RABBITMQ_PORT
          value: {{ .Values.rabbitmq.port | quote }}
        command:
        - sh
        - -c
        - |
          php -r 'for($i=0;$i<90;$i++){$f=@fsockopen(getenv("RABBITMQ_HOST"),(int)getenv("RABBITMQ_PORT"),$e,$n,2);if($f){fclose($f);exit(0);}echo "waiting for rabbitmq\n";sleep(2);}exit(1);'
      {{- end }}
      containers:
      - name: autotests-worker
        image: {{ include "doqa.image" (dict "img" .Values.backend.image "root" .) | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- include "doqa.containerSecurityContext" (dict "component" .Values.autotestsWorker "root" .) | nindent 8 }}
        # Mirrors vendor 4.3.1 `doqa_autotests`: declare all queues (autotests
        # is otherwise created by the parser on first report), then run
        # workerProcesses parallel autotests:work consumers.
        command:
        - sh
        - -lc
        - |
          php -r 'require "vendor/autoload.php"; $c = new PhpAmqpLib\Connection\AMQPStreamConnection(getenv("RABBITMQ_HOST"), getenv("RABBITMQ_PORT") ?: 5672, getenv("RABBITMQ_USER"), getenv("RABBITMQ_PASSWORD"), getenv("RABBITMQ_VIRTUAL_HOST") ?: "/"); $ch = $c->channel(); foreach (["autotests", "default", "search", "requirements", "autotests-domain", "outbound-webhooks", "import", "llm-bulk"] as $q) { $ch->queue_declare($q, false, true, false, false); }' && for i in $(seq 1 "{{ .Values.autotestsWorker.workerProcesses }}"); do php artisan autotests:work --prefetch="{{ .Values.autotestsWorker.prefetch }}" & done; wait
        envFrom:
          {{- include "doqa.backendEnvFrom" . | nindent 10 }}
        env:
          {{- include "doqa.backendSecretEnv" . | nindent 10 }}
        resources:
          {{- toYaml .Values.autotestsWorker.resources | nindent 10 }}
        {{- with .Values.extraVolumeMounts }}
        volumeMounts:
{{- range . }}
          - {{ toYaml . | nindent 12 }}
{{- end }}
        {{- end }}
      {{- with .Values.extraVolumes }}
      volumes:
{{- range . }}
        - {{ toYaml . | nindent 10 }}
{{- end }}
      {{- end }}
      {{- with (or .Values.autotestsWorker.nodeSelector .Values.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (or .Values.autotestsWorker.affinity .Values.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (or .Values.autotestsWorker.tolerations .Values.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
