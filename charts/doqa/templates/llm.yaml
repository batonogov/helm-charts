apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "doqa.fullname" . }}-llm
  labels:
    {{- include "doqa.labels" . | nindent 4 }}
    app.kubernetes.io/component: llm
spec:
  replicas: {{ .Values.llm.replicas }}
  selector:
    matchLabels:
      {{- include "doqa.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: llm
  template:
    metadata:
      labels:
        {{- include "doqa.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: llm
      annotations:
        {{- with .Values.extraAnnotations }}
        {{- include "doqa.extraAnnotations" . | nindent 8 }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "doqa.serviceAccountName" . }}
      {{- include "doqa.imagePullSecrets" . | nindent 6 }}
      {{- include "doqa.podSecurityContext" (dict "component" .Values.llm "root" .) | nindent 6 }}
      containers:
      - name: llm
        image: {{ include "doqa.image" (dict "img" .Values.llm.image "root" .) | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- include "doqa.containerSecurityContext" (dict "component" .Values.llm "root" .) | nindent 8 }}
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        command:
        - bash
        - -c
        - gunicorn -b 0.0.0.0:3000 asgi:create_app -n app -k asgi_config.asgi_worker.TaskUvicornWorker -w 2
        env:
        - name: DEBUG
          value: {{ .Values.debug | quote }}
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "doqa.secret.apiKeys" . }}
              key: llm-api-key
        - name: STUB_AUTH
          value: "False"
        - name: PREFIX_ROOT_PATH
          value: "/"
        - name: STATISTIC_HOST
          value: {{ printf "http://%s-statistic:3000/" (include "doqa.fullname" .) | quote }}
        - name: STATISTIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "doqa.secret.apiKeys" . }}
              key: statistic-api-key
        - name: GUNICORN_TIMEOUT
          value: "120"
        - name: ERROR_API_TRACE
          value: "False"
        - name: IS_BOX
          value: "True"
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          {{- toYaml .Values.llm.resources | nindent 10 }}
        {{- with .Values.extraVolumeMounts }}
        volumeMounts:
{{- range . }}
          - {{ toYaml . | nindent 12 }}
{{- end }}
        {{- end }}
      {{- with .Values.extraVolumes }}
      volumes:
{{- range . }}
        - {{ toYaml . | nindent 10 }}
{{- end }}
      {{- end }}
      {{- with (or .Values.llm.nodeSelector .Values.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (or .Values.llm.affinity .Values.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (or .Values.llm.tolerations .Values.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "doqa.fullname" . }}-llm
  labels:
    {{- include "doqa.labels" . | nindent 4 }}
    app.kubernetes.io/component: llm
spec:
  {{- include "doqa.componentService" (dict "ctx" . "component" "llm" "name" "http" "port" 3000) | nindent 2 }}
