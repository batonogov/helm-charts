{{- if .Values.secrets.create }}
{{- if not .Values.secrets.app }}
{{/* Existing APP_KEY values are preserved verbatim; fresh values decode to 32 bytes for Laravel AES-256. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "doqa.secret.app" . }}
  labels:
    {{- include "doqa.labels" . | nindent 4 }}
type: Opaque
stringData:
  app-key: {{ include "doqa.stableAppKey" (dict "ctx" . "name" (include "doqa.secret.app" .)) | quote }}
  jwt-secret: {{ include "doqa.stableSecret" (dict "ctx" . "name" (include "doqa.secret.app" .) "key" "jwt-secret" "len" 32) | quote }}
  internal-system-key: {{ include "doqa.stableSecret" (dict "ctx" . "name" (include "doqa.secret.app" .) "key" "internal-system-key" "len" 32) | quote }}
{{- end }}
{{- if not .Values.secrets.apiKeys }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "doqa.secret.apiKeys" . }}
  labels:
    {{- include "doqa.labels" . | nindent 4 }}
type: Opaque
stringData:
  statistic-api-key: {{ include "doqa.stableSecret" (dict "ctx" . "name" (include "doqa.secret.apiKeys" .) "key" "statistic-api-key" "len" 32) | quote }}
  notification-api-key: {{ include "doqa.stableSecret" (dict "ctx" . "name" (include "doqa.secret.apiKeys" .) "key" "notification-api-key" "len" 32) | quote }}
  llm-api-key: {{ include "doqa.stableSecret" (dict "ctx" . "name" (include "doqa.secret.apiKeys" .) "key" "llm-api-key" "len" 32) | quote }}
{{- end }}
{{- if not .Values.secrets.pusher }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "doqa.secret.pusher" . }}
  labels:
    {{- include "doqa.labels" . | nindent 4 }}
type: Opaque
stringData:
  app-secret: {{ include "doqa.stableSecret" (dict "ctx" . "name" (include "doqa.secret.pusher" .) "key" "app-secret" "len" 32) | quote }}
{{- end }}
{{- if and .Values.rabbitmq.create (not .Values.secrets.rabbitmq) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "doqa.secret.rabbitmq" . }}
  labels:
    {{- include "doqa.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ include "doqa.stableSecret" (dict "ctx" . "name" (include "doqa.secret.rabbitmq" .) "key" "password" "len" 32) | quote }}
  erlang-cookie: {{ include "doqa.stableSecret" (dict "ctx" . "name" (include "doqa.secret.rabbitmq" .) "key" "erlang-cookie" "len" 32) | quote }}
{{- end }}
{{- if and .Values.minio.create (not .Values.secrets.minio) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "doqa.secret.minio" . }}
  labels:
    {{- include "doqa.labels" . | nindent 4 }}
type: Opaque
stringData:
  access-key: {{ include "doqa.stableSecret" (dict "ctx" . "name" (include "doqa.secret.minio" .) "key" "access-key" "len" 20) | quote }}
  secret-key: {{ include "doqa.stableSecret" (dict "ctx" . "name" (include "doqa.secret.minio" .) "key" "secret-key" "len" 40) | quote }}
{{- end }}
{{- end }}
