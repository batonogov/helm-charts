apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "doqa.fullname" . }}-frontend
  labels:
    {{- include "doqa.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.frontend.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "doqa.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "doqa.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
        {{- with .Values.podLabels }}
        {{- include "doqa.podLabels" . | nindent 8 }}
        {{- end }}
      annotations:
        {{- with .Values.extraAnnotations }}
        {{- include "doqa.extraAnnotations" . | nindent 8 }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "doqa.serviceAccountName" . }}
      {{- include "doqa.imagePullSecrets" . | nindent 6 }}
      {{- include "doqa.podSecurityContext" (dict "component" .Values.frontend "root" .) | nindent 6 }}
      containers:
      - name: frontend
        image: {{ include "doqa.image" (dict "img" .Values.frontend.image "root" .) | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- include "doqa.containerSecurityContext" (dict "component" .Values.frontend "root" .) | nindent 8 }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          {{- toYaml .Values.frontend.resources | nindent 10 }}
        {{- with .Values.extraVolumeMounts }}
        volumeMounts:
{{- range . }}
          - {{ toYaml . | nindent 12 }}
{{- end }}
        {{- end }}
      {{- with .Values.extraVolumes }}
      volumes:
{{- range . }}
        - {{ toYaml . | nindent 10 }}
{{- end }}
      {{- end }}
      {{- with (or .Values.frontend.nodeSelector .Values.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (or .Values.frontend.affinity .Values.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (or .Values.frontend.tolerations .Values.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints.frontend }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "doqa.fullname" . }}-frontend
  labels:
    {{- include "doqa.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  {{- include "doqa.componentService" (dict "ctx" . "component" "frontend" "name" "http" "port" 8080) | nindent 2 }}
