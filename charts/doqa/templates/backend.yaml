apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "doqa.fullname" . }}-backend
  labels:
    {{- include "doqa.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "doqa.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      annotations:
        checksum/env: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.backend.phpFpm.enabled }}
        checksum/fpm-pool: {{ include (print $.Template.BasePath "/backend-fpm-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.extraAnnotations }}
        {{- include "doqa.extraAnnotations" . | nindent 8 }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "doqa.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
        {{- with .Values.podLabels }}
        {{- include "doqa.podLabels" . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "doqa.serviceAccountName" . }}
      {{- include "doqa.imagePullSecrets" . | nindent 6 }}
      {{- include "doqa.podSecurityContext" (dict "component" .Values.backend "root" .) | nindent 6 }}
      {{- if not .Values.backend.skipMigrate }}
      initContainers:
      {{- if .Values.backend.migrate.waitForRabbitmq }}
      - name: wait-for-rabbitmq
        image: {{ include "doqa.image" (dict "img" .Values.backend.image "root" .) | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- include "doqa.containerSecurityContext" (dict "component" .Values.backend "root" .) | nindent 8 }}
        env:
        - name: RABBITMQ_HOST
          value: {{ include "doqa.rabbitmq.host" . | quote }}
        - name: RABBITMQ_PORT
          value: {{ .Values.rabbitmq.port | quote }}
        command:
        - sh
        - -c
        - |
          php -r 'for($i=0;$i<90;$i++){$f=@fsockopen(getenv("RABBITMQ_HOST"),(int)getenv("RABBITMQ_PORT"),$e,$n,2);if($f){fclose($f);exit(0);}echo "waiting for rabbitmq\n";sleep(2);}exit(1);'
      {{- end }}
      - name: migrate
        image: {{ include "doqa.image" (dict "img" .Values.backend.image "root" .) | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- include "doqa.containerSecurityContext" (dict "component" .Values.backend "root" .) | nindent 8 }}
        command: ["php", "artisan", "migrate", "--force"]
        envFrom:
          {{- include "doqa.backendEnvFrom" . | nindent 10 }}
        env:
          {{- include "doqa.backendSecretEnv" . | nindent 10 }}
        {{- with .Values.extraVolumeMounts }}
        volumeMounts:
{{- range . }}
          - {{ toYaml . | nindent 12 }}
{{- end }}
        {{- end }}
      {{- end }}
      containers:
      - name: backend
        image: {{ include "doqa.image" (dict "img" .Values.backend.image "root" .) | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- include "doqa.containerSecurityContext" (dict "component" .Values.backend "root" .) | nindent 8 }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        envFrom:
          {{- include "doqa.backendEnvFrom" . | nindent 10 }}
        env:
          {{- include "doqa.backendSecretEnv" . | nindent 10 }}
        # tcpSocket only proves the listen backlog accepts a connection, not
        # that php-fpm has a free worker to answer it -- a pool saturated at
        # pm.max_children keeps accepting into the kernel backlog and this
        # probe stays green while every real request hangs. `curl` without
        # `-f` treats any HTTP response (incl. 404/401) as success and only
        # fails on the transport-level timeout below, which is exactly the
        # failure mode a saturated/hung pool produces.
        livenessProbe:
          exec:
            command: ["sh", "-c", "curl -sS -o /dev/null --max-time 5 http://127.0.0.1:8080/"]
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          exec:
            command: ["sh", "-c", "curl -sS -o /dev/null --max-time 5 http://127.0.0.1:8080/"]
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 8
        resources:
          {{- toYaml .Values.backend.resources | nindent 10 }}
        {{- if or .Values.backend.phpFpm.enabled .Values.extraVolumeMounts }}
        volumeMounts:
        {{- if .Values.backend.phpFpm.enabled }}
        - name: fpm-pool
          mountPath: /usr/local/etc/php-fpm.conf
          subPath: php-fpm.conf
          readOnly: true
        {{- end }}
        {{- range .Values.extraVolumeMounts }}
        - {{ toYaml . | nindent 10 }}
        {{- end }}
        {{- end }}
      {{- if or .Values.backend.phpFpm.enabled .Values.extraVolumes }}
      volumes:
      {{- if .Values.backend.phpFpm.enabled }}
      - name: fpm-pool
        configMap:
          name: {{ include "doqa.fullname" . }}-backend-fpm-pool
      {{- end }}
      {{- range .Values.extraVolumes }}
      - {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- with (or .Values.backend.nodeSelector .Values.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (or .Values.backend.affinity .Values.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (or .Values.backend.tolerations .Values.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints.backend }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "doqa.fullname" . }}-backend
  labels:
    {{- include "doqa.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- include "doqa.componentService" (dict "ctx" . "component" "backend" "name" "http" "port" 8080) | nindent 2 }}
