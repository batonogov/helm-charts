repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^\.claude/
      - id: end-of-file-fixer
        exclude: ^\.claude/
      - id: check-yaml
        exclude: ^(\.claude/|charts/[^/]+/templates/)
      - id: check-json
        exclude: ^\.claude/
      - id: check-toml
        exclude: ^\.claude/
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^\.claude/
  - repo: local
    hooks:
      - id: helm-docs
        name: helm-docs
        entry: scripts/check-helm-docs.sh
        language: script
        pass_filenames: false
        files: ^charts/.*
      - id: helm-lint
        name: helm lint
        entry: scripts/helm-lint-all.sh
        language: script
        pass_filenames: false
        files: ^charts/.*
      - id: helm-template
        name: helm template
        entry: scripts/helm-template-all.sh
        language: script
        pass_filenames: false
        files: ^charts/.*
      - id: doqa-portability
        name: doqa portability
        entry: scripts/check-doqa-portability.sh
        language: script
        pass_filenames: false
        files: ^(charts/doqa/|scripts/check-doqa-portability\.sh$)
      - id: doqa-reliability
        name: DoQA reliability checks
        entry: python3 scripts/check-doqa-reliability.py
        language: python
        additional_dependencies: [PyYAML==6.0.3]
        pass_filenames: false
        files: ^(charts/doqa/|scripts/check-doqa-reliability\.py$)
      - id: xray-reliability
        name: xray-health-exporter reliability checks
        entry: python3 scripts/check-xray-reliability.py
        language: python
        additional_dependencies: [PyYAML==6.0.3]
        pass_filenames: false
        files: ^(charts/xray-health-exporter/|scripts/check-xray-reliability\.py$)
